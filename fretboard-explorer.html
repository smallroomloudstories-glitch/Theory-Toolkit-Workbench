<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory Toolkit - Fretboard Explorer Workbench</title>
  <link rel="stylesheet" href="./src/styles/fretboard-view.css?v=20260814-6">
  <style>
    body { font-family: sans-serif; max-width: 1650px; margin: 1.25rem auto 2rem; padding: 0 1rem; }
    h1 { margin: .35rem 0; }
    .workbench-mark { margin: .25rem 0; font-weight: bold; }
    .checkpoint-note { margin: .4rem 0 1rem; max-width: 900px; }
    .focus-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; border: 1px solid #bbb; padding: .55rem .75rem; margin: .75rem 0 1.25rem; }
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; align-items: start; }
    .controls-grid fieldset { margin: 0; min-width: 0; }
    .notes-panel { grid-column: 1 / -1; }
    fieldset { margin-bottom: 1.25rem; }
    label { margin-right: 1rem; white-space: nowrap; }
    button { margin: .2rem; padding: .45rem .7rem; cursor: pointer; }
    button.selected { font-weight: bold; outline: 3px solid currentColor; outline-offset: 1px; }
    .string-scope-button { width: 100%; margin: 0; padding: .35rem .45rem; border: 1px solid transparent; background: transparent; text-align: left; }
    .string-scope-button:hover { border-color: #777; }
    .string-scope-button.selected { background: #e3efff; border-color: #245a9a; outline: 2px solid #245a9a; outline-offset: -2px; }
    td.fret-position { cursor: pointer; }
    .hidden-note { color: transparent; }
    .selected-note { font-weight: bold; outline: 3px solid currentColor; outline-offset: -4px; }
    .focused-position { box-shadow: inset 0 0 0 4px #111; background: #fff3a6; color: #111; font-weight: bold; }
  </style>
</head>
<body>
  <p><a href="index.html">← Workbench Home</a></p>
  <h1>Fretboard Explorer — WORKBENCH</h1>
  <p class="workbench-mark">Experimental development version.</p>
  <p class="checkpoint-note">Alignment checkpoint 3 — tapered 15-fret STUDio guitar view. Focus remains a temporary teacher annotation layer with remembered string-scope behavior.</p>

  <div class="fretboard-wrap">
    <div class="fretboard-surface fretboard-diagnostic-surface">
    <table id="fretboard-table" class="fretboard-diagnostic">
      <thead id="fretboard-head"></thead>
      <tbody id="fretboard-body"></tbody>
    </table>
    </div>
  </div>

  <div class="focus-bar">
    <strong>Focus:</strong>
    <span id="focus-status">No positions focused</span>
    <button type="button" id="clear-focus">Clear Focus</button>
  </div>

  <div class="controls-grid">
    <fieldset>
      <legend>Instrument</legend>
      <label>Instrument: <strong>Guitar</strong></label>
      <label for="tuning-select">Tuning:</label>
      <select id="tuning-select"></select>
    </fieldset>

    <fieldset>
      <legend>Display</legend>
      <label><input type="radio" name="display-mode" value="filter" checked> Filter selected notes</label>
      <label><input type="radio" name="display-mode" value="highlight"> Show all notes + highlight selections</label>
    </fieldset>

    <fieldset class="notes-panel">
      <legend>Select Notes</legend>
      <div id="note-controls"></div>
      <button type="button" id="clear-notes">Clear all</button>
    </fieldset>
  </div>

  <script type="module">
    import { CHROMATIC_SHARPS, GUITAR_TUNINGS } from "./src/data/music-data.js";
    import { buildFretboard } from "./src/engine/fretboard.js";
    import { createFretboardFocus } from "./src/engine/fretboard-focus.js";
    import { FRETBOARD_MAX_FRET, configureFretboardView, positionFretboardCells } from "./src/ui/fretboard-view.js?v=20260814-6";

    let activeTuning = GUITAR_TUNINGS.standard;
    let fretboard = buildFretboard(activeTuning.strings, FRETBOARD_MAX_FRET);
    const focus = createFretboardFocus();
    const focusOverrides = new Set();
    const selectedStrings = new Set();
    let allStringsActive = true;
    const selectedNotes = new Set();
    const noteControls = document.querySelector("#note-controls");
    const clearNotes = document.querySelector("#clear-notes");
    const clearFocus = document.querySelector("#clear-focus");
    const focusStatus = document.querySelector("#focus-status");
    const tuningSelect = document.querySelector("#tuning-select");
    const noteButtons = new Map();

    const positionKey = (stringNumber, fretNumber) => `${stringNumber}:${fretNumber}`;

    for (const tuning of Object.values(GUITAR_TUNINGS)) {
      const option = document.createElement("option");
      option.value = tuning.id;
      option.textContent = tuning.name;
      tuningSelect.appendChild(option);
    }

    tuningSelect.addEventListener("change", () => {
      activeTuning = GUITAR_TUNINGS[tuningSelect.value];
      fretboard = buildFretboard(activeTuning.strings, FRETBOARD_MAX_FRET);
      focus.clear();
      focusOverrides.clear();
      resetStringScope();
      renderFretboard();
    });

    function resetStringScope() {
      selectedStrings.clear();
      allStringsActive = true;
      focusOverrides.clear();
    }

    function toggleStringScope(stringNumber) {
      if (allStringsActive) {
        allStringsActive = false;
        selectedStrings.add(stringNumber);
      } else if (selectedStrings.has(stringNumber)) {
        selectedStrings.delete(stringNumber);
        if (selectedStrings.size === 0) allStringsActive = true;
      } else {
        selectedStrings.add(stringNumber);
      }
      focusOverrides.clear();
      renderFretboard();
    }

    for (const note of CHROMATIC_SHARPS) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = note;
      button.setAttribute("aria-pressed", "false");
      noteControls.appendChild(button);
      noteButtons.set(note, button);
      button.addEventListener("click", () => {
        if (selectedNotes.has(note)) selectedNotes.delete(note);
        else selectedNotes.add(note);
        updateNoteButtons();
        renderFretboard();
      });
    }

    clearNotes.addEventListener("click", () => {
      selectedNotes.clear();
      updateNoteButtons();
      renderFretboard();
    });

    clearFocus.addEventListener("click", () => {
      focus.clear();
      focusOverrides.clear();
      renderFretboard();
    });

    for (const radio of document.querySelectorAll('input[name="display-mode"]')) {
      radio.addEventListener("change", renderFretboard);
    }

    function displayMode() {
      return document.querySelector('input[name="display-mode"]:checked').value;
    }

    function updateNoteButtons() {
      for (const [note, button] of noteButtons) {
        const selected = selectedNotes.has(note);
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      }
    }

    function updateFocusStatus() {
      focusStatus.textContent = focus.size === 0 ? "No positions focused" : `${focus.size} position${focus.size === 1 ? "" : "s"} focused`;
      clearFocus.disabled = focus.size === 0;
    }

    configureFretboardView({
      table: document.querySelector("#fretboard-table"),
      head: document.querySelector("#fretboard-head"),
      maxFret: FRETBOARD_MAX_FRET,
      firstHeader: '<button type="button" id="all-strings" class="string-scope-button selected" aria-pressed="true" title="Show all strings">String</button>'
    });

    document.querySelector("#all-strings").addEventListener("click", () => {
      resetStringScope();
      renderFretboard();
    });

    function renderFretboard() {
      const body = document.querySelector("#fretboard-body");
      body.innerHTML = "";
      const mode = displayMode();
      const hasNoteFilter = selectedNotes.size > 0;

      for (const stringData of fretboard) {
        const stringMatches = allStringsActive || selectedStrings.has(stringData.string);
        const row = document.createElement("tr");
        const stringLabel = document.createElement("td");
        const stringButton = document.createElement("button");
        const stringSelected = allStringsActive || selectedStrings.has(stringData.string);
        stringButton.type = "button";
        stringButton.className = "string-scope-button";
        stringButton.classList.toggle("selected", stringSelected);
        stringButton.setAttribute("aria-pressed", String(stringSelected));
        stringButton.textContent = stringData.label;
        stringButton.title = `Toggle ${stringData.label} string scope`;
        stringButton.addEventListener("click", () => toggleStringScope(stringData.string));
        stringLabel.appendChild(stringButton);
        row.appendChild(stringLabel);

        stringData.frets.forEach(({ note }, fretNumber) => {
          const noteMatches = selectedNotes.has(note);
          const key = positionKey(stringData.string, fretNumber);
          const isFocused = focus.has(stringData.string, fretNumber);
          const isFocusOverride = isFocused && focusOverrides.has(key);
          let visible;
          if (mode === "highlight") visible = stringMatches;
          else if (hasNoteFilter) visible = stringMatches && noteMatches;
          else visible = stringMatches;

          const cell = document.createElement("td");
          cell.classList.add("fret-position");
          if (!visible && !isFocusOverride) cell.classList.add("hidden-note");
          if (visible && noteMatches) cell.classList.add("selected-note");
          if (isFocused && (visible || isFocusOverride)) cell.classList.add("focused-position");
          cell.textContent = note;
          cell.dataset.string = String(stringData.string);
          cell.dataset.fret = String(fretNumber);
          cell.title = `String ${stringData.string}, ${fretNumber === 0 ? "open" : `fret ${fretNumber}`}: ${note}`;
          cell.addEventListener("click", () => {
            const wasFocused = focus.has(stringData.string, fretNumber);
            if (wasFocused) {
              focus.toggle(stringData.string, fretNumber);
              focusOverrides.delete(key);
            } else {
              focus.toggle(stringData.string, fretNumber);
              // Clicking a position that is currently hidden is an explicit
              // teacher instruction, so Focus temporarily overrides the view.
              if (!visible) focusOverrides.add(key);
            }
            renderFretboard();
          });
          row.appendChild(cell);
        });
        body.appendChild(row);
      }
      const allStringsButton = document.querySelector("#all-strings");
      allStringsButton.classList.toggle("selected", allStringsActive);
      allStringsButton.setAttribute("aria-pressed", String(allStringsActive));
      positionFretboardCells(document.querySelector("#fretboard-table"), FRETBOARD_MAX_FRET);
      updateFocusStatus();
    }

    resetStringScope();
    updateNoteButtons();
    renderFretboard();
  </script>
</body>
</html>
