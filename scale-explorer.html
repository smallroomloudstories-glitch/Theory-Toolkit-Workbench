<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Toolkit - Scale Explorer Workbench</title><style>body{font-family:sans-serif;max-width:1200px;margin:1.25rem auto 2rem;padding:0 1rem}h1{margin:.35rem 0}.workbench-mark{margin:.25rem 0;font-weight:bold}.checkpoint-note{margin:.4rem 0 1rem;max-width:900px}.controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;margin:1.5rem 0}label{display:grid;gap:.35rem;font-weight:bold}select,input,textarea,button{font:inherit}select,input,textarea{padding:.45rem .6rem}select:disabled{opacity:.5}.summary{margin:1rem 0 1.5rem;padding:.8rem 1rem;background:#f3f3f3;border:1px solid #ccc}.fretboard-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{border:1px solid #bbb;padding:.45rem;text-align:center;min-width:2.7rem}th:first-child,td:first-child{text-align:left;white-space:nowrap}td.scale-note{font-weight:bold;background:#e8e8e8}td.root-note{outline:3px solid currentColor;outline-offset:-4px}td.role-root{background:#bfe8c2;color:#163b1a}td.role-third{background:#666;color:#fff}td.role-fifth{background:#d8d8d8;color:#222}td.blue-note{background:#b9dcff;color:#003d73;font-weight:bold}td.not-in-scale{color:#bbb}.legend{margin:1rem 0 1.25rem;color:#444;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;min-height:1.6rem}.chip{display:inline-block;padding:.1rem .4rem;border:1px solid #999;font-weight:bold}.root-chip{background:#bfe8c2;color:#163b1a}.third-chip{background:#666;color:#fff}.fifth-chip{background:#d8d8d8;color:#222}.blue-chip{background:#b9dcff;color:#003d73;border-color:#7db7ec}.feedback-launch{margin:2rem 0 1rem}.feedback-launch button,.feedback-actions button{padding:.55rem .85rem;cursor:pointer}.feedback-panel{border:1px solid #bbb;background:#fafafa;padding:1rem 1.2rem;margin:1rem 0 2rem}.feedback-panel[hidden]{display:none}.feedback-panel h2{margin-top:0}.feedback-panel label{margin:.85rem 0}.feedback-panel textarea{min-height:8rem;resize:vertical}.feedback-panel input,.feedback-panel textarea{box-sizing:border-box;width:100%}.feedback-panel .optional{font-weight:normal;color:#555}.feedback-contact{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.feedback-actions{display:flex;gap:.7rem;align-items:center;margin-top:1rem}.feedback-note{font-size:.9rem;color:#555}.feedback-status{font-weight:bold}.feedback-status.error{color:#8b0000}@media(max-width:650px){.feedback-contact{grid-template-columns:1fr}}.focus-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;border:1px solid #bbb;padding:.55rem .75rem;margin:.75rem 0 1.25rem}.fret-position{cursor:pointer}.focused-position{box-shadow:inset 0 0 0 4px #111;background:#fff3a6!important;color:#111!important;font-weight:bold}</style></head><body>

<h1>Scale Explorer — WORKBENCH</h1>
<p class="workbench-mark">Experimental development version.</p>
<p class="checkpoint-note">Layout checkpoint 1 — the fretboard is the primary work surface. Manually focused positions remain visible while comparing scales and positions.</p>

<div class="fretboard-wrap">
  <table>
    <thead id="fretboard-head"></thead>
    <tbody id="fretboard-body"></tbody>
  </table>
</div>

<div class="summary" id="summary"></div>
<div class="legend" id="legend"></div>

<div class="focus-bar">
  <strong>Focus:</strong>
  <span id="focus-status">No positions focused</span>
  <button type="button" id="clear-focus">Clear Focus</button>
</div>

<div class="controls">
  <label>Root / Key<select id="root"></select></label>
  <label>Scale<select id="scale"><option value="major">Major</option><option value="minor">Minor</option></select></label>
  <label>Scale View<select id="scale-view"><option value="diatonic">Diatonic</option><option value="pentatonic">Pentatonic</option><option value="blues">Blues</option></select></label>
  <label>Display<select id="display"><option value="fretboard">Fretboard</option><option value="position">Position</option></select></label>
  <label>Position<select id="position" disabled><option value="0">Shape 1</option><option value="1">Shape 2</option><option value="2">Shape 3</option><option value="3">Shape 4</option><option value="4">Shape 5</option></select></label>
  <label>Note Labels<select id="labels"><option value="notes">Notes</option><option value="intervals">Intervals / Degrees</option></select></label>
</div>
<script type="module">import{CHROMATIC_SHARPS,STANDARD_GUITAR_TUNING}from"./src/data/music-data.js";import{buildFretboard}from"./src/engine/fretboard.js";import{createFretboardFocus}from"./src/engine/fretboard-focus.js";
const SCALE_FORMULAS={diatonic:{major:{name:"Major",semitones:[0,2,4,5,7,9,11]},minor:{name:"Minor",semitones:[0,2,3,5,7,8,10]}},pentatonic:{major:{name:"Major Pentatonic",semitones:[0,2,4,7,9]},minor:{name:"Minor Pentatonic",semitones:[0,3,5,7,10]}},blues:{major:{name:"Major Blues",semitones:[0,2,3,4,7,9],blueOffset:3},minor:{name:"Minor Blues",semitones:[0,3,5,6,7,10],blueOffset:6}}};
const INTERVAL_NAMES={0:"R",1:"b2",2:"2",3:"b3",4:"3",5:"4",6:"b5",7:"5",8:"b6",9:"6",10:"b7",11:"7"};
const G_MAJOR_DIATONIC=[[[2,3,5],[2,3,5],[2,4,5],[2,4,5],[3,5],[2,3,5]],[[5,7,8],[5,7],[4,5,7],[4,5,7],[5,7,8],[5,7,8]],[[7,8,10],[7,9,10],[7,9,10],[7,9],[7,8,10],[7,8,10]],[[10,12],[9,10,12],[9,10,12],[9,11,12],[10,12,13],[10,12]],[[12,14,15],[12,14,15],[12,14],[11,12,14],[12,13,15],[12,14,15]]];
const G_MAJOR_PENTATONIC=[[[3,5],[2,5],[2,5],[2,4],[3,5],[3,5]],[[5,7],[5,7],[5,7],[4,7],[5,8],[5,7]],[[7,10],[7,10],[7,9],[7,9],[8,10],[7,10]],[[10,12],[10,12],[9,12],[9,12],[10,12],[10,12]],[[12,15],[12,14],[12,14],[12,14],[12,15],[12,15]]];
const G_MAJOR_BLUES=[[[3,5,6],[2,5],[2,5],[2,3,4],[3,5],[3,5,6]],[[5,6,7],[5,7],[5,7,8],[4,7],[5,8],[5,6,7]],[[7,10],[7,10],[7,8,9],[7,9],[8,10,11],[7,10]],[[10,12],[10,12,13],[9,12],[9,12],[10,11,12],[10,12]],[[12,15],[12,13,14],[12,14],[12,14,15],[12,15],[12,15]]];
const MINOR_FROM_MAJOR=[4,0,1,2,3],MAX_FRET=18,fretboard=buildFretboard(STANDARD_GUITAR_TUNING,MAX_FRET),focus=createFretboardFocus(),focusOverrides=new Set;const positionKey=(stringNumber,fretNumber)=>`${stringNumber}:${fretNumber}`;const rootSelect=document.querySelector("#root"),scaleSelect=document.querySelector("#scale"),scaleViewSelect=document.querySelector("#scale-view"),displaySelect=document.querySelector("#display"),positionSelect=document.querySelector("#position"),labelSelect=document.querySelector("#labels"),summary=document.querySelector("#summary"),legend=document.querySelector("#legend"),fretboardHead=document.querySelector("#fretboard-head"),fretboardBody=document.querySelector("#fretboard-body");rootSelect.innerHTML=CHROMATIC_SHARPS.map(n=>`<option value="${n}" ${n==="G"?"selected":""}>${n}</option>`).join("");
function buildScale(root,f){const i=CHROMATIC_SHARPS.indexOf(root);return f.semitones.map(o=>CHROMATIC_SHARPS[(i+o)%12])}function noteAtOffset(root,o){return CHROMATIC_SHARPS[(CHROMATIC_SHARPS.indexOf(root)+o)%12]}function intervalOffset(root,note){return(CHROMATIC_SHARPS.indexOf(note)-CHROMATIC_SHARPS.indexOf(root)+12)%12}function rootOffsetFromG(root){return(CHROMATIC_SHARPS.indexOf(root)-CHROMATIC_SHARPS.indexOf("G")+12)%12}function transposeShape(shape,a){return shape.map(s=>s.map(f=>f+a))}function selectedShape(root,q,v,p){const k=rootOffsetFromG(root),patterns=v==="diatonic"?G_MAJOR_DIATONIC:v==="pentatonic"?G_MAJOR_PENTATONIC:G_MAJOR_BLUES;if(q==="major")return transposeShape(patterns[p],k);return transposeShape(patterns[MINOR_FROM_MAJOR[p]],k+3)}function visibleOccurrences(shape){const o=[];for(let oct=-2;oct<=2;oct++){const s=transposeShape(shape,oct*12);if(s.flat().some(f=>f>=0&&f<=MAX_FRET))o.push(s)}return o}function shapeCellSet(shape){const cells=new Set;for(const occ of visibleOccurrences(shape))occ.forEach((frets,pi)=>{const di=5-pi;frets.forEach(f=>{if(f>=0&&f<=MAX_FRET)cells.add(`${di}:${f}`)})});return cells}function renderHead(){fretboardHead.innerHTML=`<tr><th>String</th>${Array.from({length:MAX_FRET+1},(_,f)=>`<th>${f===0?"Open":f}</th>`).join("")}</tr>`}function updateFocusStatus(){focusStatus.textContent=focus.size===0?"No positions focused":`${focus.size} position${focus.size===1?"":"s"} focused`;clearFocus.disabled=focus.size===0}
function render(){const root=rootSelect.value,q=scaleSelect.value,v=scaleViewSelect.value,d=displaySelect.value,p=Number(positionSelect.value),formula=SCALE_FORMULAS[v][q],notes=buildScale(root,formula),scaleSet=new Set(notes),blueNote=v==="blues"?noteAtOffset(root,formula.blueOffset):null,use=d==="position",showIntervals=labelSelect.value==="intervals",cells=use?shapeCellSet(selectedShape(root,q,v,p)):null;positionSelect.disabled=!use;summary.innerHTML=`<strong>${root} ${formula.name}:</strong> ${notes.join(" – ")} &nbsp;|&nbsp; <strong>${use?`Shape ${p+1}`:"Whole fretboard"}</strong>`;legend.innerHTML=showIntervals?`<span>Intervals:</span><span class="chip root-chip">R</span><span class="chip third-chip">3 / b3</span><span class="chip fifth-chip">5</span>${v==="blues"?`<span class="chip blue-chip">${INTERVAL_NAMES[formula.blueOffset]} blue note</span>`:""}`:(v==="blues"?`Blue note: <span class="chip blue-chip">${blueNote}</span>`:"");fretboardBody.innerHTML="";fretboard.forEach((stringData,i)=>{const row=document.createElement("tr"),label=document.createElement("td");label.textContent=stringData.label;row.appendChild(label);stringData.frets.forEach(({note,fret})=>{const inView=use?cells.has(`${i}:${fret}`):scaleSet.has(note),off=intervalOffset(root,note),interval=INTERVAL_NAMES[off],key=positionKey(stringData.string,fret),isFocused=focus.has(stringData.string,fret),isOverride=isFocused&&focusOverrides.has(key),show=inView||isOverride,isBlue=inView&&v==="blues"&&off===formula.blueOffset,isRoot=inView&&off===0,isThird=inView&&(off===3||off===4),isFifth=inView&&off===7,cell=document.createElement("td");cell.className=["fret-position",inView?"scale-note":"not-in-scale",!showIntervals&&inView&&note===root?"root-note":"",showIntervals&&isRoot?"role-root":"",showIntervals&&isThird?"role-third":"",showIntervals&&isFifth?"role-fifth":"",isBlue?"blue-note":"",isFocused&&(inView||isOverride)?"focused-position":""].filter(Boolean).join(" ");cell.textContent=show?(showIntervals?interval:note):"·";cell.title=`String ${stringData.string}, ${fret===0?"open":`fret ${fret}`}: ${note}`;cell.addEventListener("click",()=>{if(isFocused){focus.toggle(stringData.string,fret);focusOverrides.delete(key)}else{focus.toggle(stringData.string,fret);focusOverrides.add(key)}render()});row.appendChild(cell)});fretboardBody.appendChild(row)});updateFocusStatus()}
const clearFocus=document.querySelector("#clear-focus"),focusStatus=document.querySelector("#focus-status");clearFocus.addEventListener("click",()=>{focus.clear();focusOverrides.clear();render()});renderHead();[rootSelect,scaleSelect,scaleViewSelect,displaySelect,positionSelect,labelSelect].forEach(el=>el.addEventListener("change",render));render();

</script></body></html>
