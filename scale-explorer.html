<p><a href="index.html">← Workbench Home</a></p>
<h1>Scale Explorer — WORKBENCH</h1>
<p class="workbench-mark">Experimental development version.</p>
<p class="checkpoint-note">Presentation checkpoint 3 — centered seven-note chromatic key wheel with smoother controlled scrolling.</p>

<div class="fretboard-wrap">
  <div class="fretboard-surface fretboard-diagnostic-surface">
  <table id="fretboard-table" class="fretboard-diagnostic scale-fretboard">
    <thead id="fretboard-head"></thead>
    <tbody id="fretboard-body"></tbody>
  </table>
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="legend" id="legend"></div>

<div class="focus-bar">
  <strong>Focus:</strong>
  <span id="focus-status">No positions focused</span>
  <button type="button" id="clear-focus">Clear Focus</button>
</div>

<div class="controls">
  <div class="key-wheel-control">
    <span class="control-label" id="key-wheel-label">Root / Key</span>
    <div class="key-wheel">
      <button type="button" id="key-wheel-trigger" class="key-wheel-trigger" aria-labelledby="key-wheel-label key-wheel-value" aria-expanded="false"><span id="key-wheel-value">G</span></button>
      <div id="key-wheel-menu" class="key-wheel-menu" role="listbox" aria-labelledby="key-wheel-label" hidden></div>
      <span class="key-wheel-help" id="key-wheel-help">Scroll to move chromatically. Click a note to select it.</span>
    </div>
    <select id="root" hidden aria-hidden="true" tabindex="-1"></select>
  </div>
  <label>Scale<select id="scale"><option value="major">Major</option><option value="minor">Minor</option></select></label>
  <label>Scale View<select id="scale-view"><option value="diatonic">Diatonic</option><option value="pentatonic">Pentatonic</option><option value="blues">Blues</option></select></label>
  <label>Display<select id="display"><option value="fretboard">Fretboard</option><option value="position">Position</option></select></label>
  <label>Position<select id="position" disabled><option value="0">Shape 1</option><option value="1">Shape 2</option><option value="2">Shape 3</option><option value="3">Shape 4</option><option value="4">Shape 5</option></select></label>
  <label>Note Labels<select id="labels"><option value="notes">Notes</option><option value="intervals">Intervals / Degrees</option></select></label>
  <label class="accidental-control">Accidentals<button type="button" id="accidental-toggle" aria-label="Showing sharps; switch to flats" title="Switch between sharps and flats">#</button></label>
</div>
<script type="module">import{CHROMATIC_SHARPS,STANDARD_GUITAR_TUNING}from"./src/data/music-data.js";import{buildFretboard}from"./src/engine/fretboard.js";import{createFretboardFocus}from"./src/engine/fretboard-focus.js";import{FRETBOARD_MAX_FRET,configureFretboardView,positionFretboardCells}from"./src/ui/fretboard-view.js";
const SCALE_FORMULAS={diatonic:{major:{name:"Major",semitones:[0,2,4,5,7,9,11]},minor:{name:"Minor",semitones:[0,2,3,5,7,8,10]}},pentatonic:{major:{name:"Major Pentatonic",semitones:[0,2,4,7,9]},minor:{name:"Minor Pentatonic",semitones:[0,3,5,7,10]}},blues:{major:{name:"Major Blues",semitones:[0,2,3,4,7,9],blueOffset:3},minor:{name:"Minor Blues",semitones:[0,3,5,6,7,10],blueOffset:6}}};
const INTERVAL_NAMES={0:"R",1:"b2",2:"2",3:"b3",4:"3",5:"4",6:"b5",7:"5",8:"b6",9:"6",10:"b7",11:"7"};
const G_MAJOR_DIATONIC=[[[2,3,5],[2,3,5],[2,4,5],[2,4,5],[3,5],[2,3,5]],[[5,7,8],[5,7],[4,5,7],[4,5,7],[5,7,8],[5,7,8]],[[7,8,10],[7,9,10],[7,9,10],[7,9],[7,8,10],[7,8,10]],[[10,12],[9,10,12],[9,10,12],[9,11,12],[10,12,13],[10,12]],[[12,14,15],[12,14,15],[12,14],[11,12,14],[12,13,15],[12,14,15]]];
const G_MAJOR_PENTATONIC=[[[3,5],[2,5],[2,5],[2,4],[3,5],[3,5]],[[5,7],[5,7],[5,7],[4,7],[5,8],[5,7]],[[7,10],[7,10],[7,9],[7,9],[8,10],[7,10]],[[10,12],[10,12],[9,12],[9,12],[10,12],[10,12]],[[12,15],[12,14],[12,14],[12,14],[12,15],[12,15]]];
const G_MAJOR_BLUES=[[[3,5,6],[2,5],[2,5],[2,3,4],[3,5],[3,5,6]],[[5,6,7],[5,7],[5,7,8],[4,7],[5,8],[5,6,7]],[[7,10],[7,10],[7,8,9],[7,9],[8,10,11],[7,10]],[[10,12],[10,12,13],[9,12],[9,12],[10,11,12],[10,12]],[[12,15],[12,13,14],[12,14],[12,14,15],[12,15],[12,15]]];
const MINOR_FROM_MAJOR=[4,0,1,2,3],MAX_FRET=FRETBOARD_MAX_FRET,fretboard=buildFretboard(STANDARD_GUITAR_TUNING,MAX_FRET),focus=createFretboardFocus(),focusOverrides=new Set,selectedStrings=new Set;
let allStringsActive=true,accidentalDisplay="sharps",wheelCenterIndex=CHROMATIC_SHARPS.indexOf("G"),lastWheelStep=0;
const FLAT_NAMES=new Map([["C#","Db"],["D#","Eb"],["F#","Gb"],["G#","Ab"],["A#","Bb"]]);
const positionKey=(stringNumber,fretNumber)=>`${stringNumber}:${fretNumber}`;
const displayNote=note=>accidentalDisplay==="flats"?(FLAT_NAMES.get(note)??note):note;
const rootSelect=document.querySelector("#root"),scaleSelect=document.querySelector("#scale"),scaleViewSelect=document.querySelector("#scale-view"),displaySelect=document.querySelector("#display"),positionSelect=document.querySelector("#position"),labelSelect=document.querySelector("#labels"),summary=document.querySelector("#summary"),legend=document.querySelector("#legend"),fretboardHead=document.querySelector("#fretboard-head"),fretboardBody=document.querySelector("#fretboard-body"),accidentalToggle=document.querySelector("#accidental-toggle"),keyWheel=document.querySelector(".key-wheel"),keyWheelTrigger=document.querySelector("#key-wheel-trigger"),keyWheelValue=document.querySelector("#key-wheel-value"),keyWheelMenu=document.querySelector("#key-wheel-menu");
rootSelect.innerHTML=CHROMATIC_SHARPS.map(n=>`<option value="${n}" ${n==="G"?"selected":""}>${n}</option>`).join("");
function buildScale(root,f){const i=CHROMATIC_SHARPS.indexOf(root);return f.semitones.map(o=>CHROMATIC_SHARPS[(i+o)%12])}function noteAtOffset(root,o){return CHROMATIC_SHARPS[(CHROMATIC_SHARPS.indexOf(root)+o)%12]}function intervalOffset(root,note){return(CHROMATIC_SHARPS.indexOf(note)-CHROMATIC_SHARPS.indexOf(root)+12)%12}function rootOffsetFromG(root){return(CHROMATIC_SHARPS.indexOf(root)-CHROMATIC_SHARPS.indexOf("G")+12)%12}function transposeShape(shape,a){return shape.map(s=>s.map(f=>f+a))}function selectedShape(root,q,v,p){const k=rootOffsetFromG(root),patterns=v==="diatonic"?G_MAJOR_DIATONIC:v==="pentatonic"?G_MAJOR_PENTATONIC:G_MAJOR_BLUES;if(q==="major")return transposeShape(patterns[p],k);return transposeShape(patterns[MINOR_FROM_MAJOR[p]],k+3)}function visibleOccurrences(shape){const o=[];for(let oct=-2;oct<=2;oct++){const s=transposeShape(shape,oct*12);if(s.flat().some(f=>f>=0&&f<=MAX_FRET))o.push(s)}return o}function shapeCellSet(shape){const cells=new Set;for(const occ of visibleOccurrences(shape))occ.forEach((frets,pi)=>{const di=5-pi;frets.forEach(f=>{if(f>=0&&f<=MAX_FRET)cells.add(`${di}:${f}`)})});return cells}
function resetStringScope(){selectedStrings.clear();allStringsActive=true;focusOverrides.clear()}
function toggleStringScope(stringNumber){if(allStringsActive){allStringsActive=false;selectedStrings.add(stringNumber)}else if(selectedStrings.has(stringNumber)){selectedStrings.delete(stringNumber);if(selectedStrings.size===0)allStringsActive=true}else selectedStrings.add(stringNumber);focusOverrides.clear();render()}
function renderKeyWheel(){keyWheelMenu.innerHTML="";for(let offset=-3;offset<=3;offset+=1){const note=CHROMATIC_SHARPS[(wheelCenterIndex+offset+12)%12],button=document.createElement("button");button.type="button";button.className=`key-wheel-option${offset===0?" center":""}`;button.dataset.note=note;button.textContent=displayNote(note);button.setAttribute("role","option");button.setAttribute("aria-selected",String(note===rootSelect.value));button.addEventListener("click",()=>commitKey(note));keyWheelMenu.appendChild(button)}}
function openKeyWheel(){wheelCenterIndex=CHROMATIC_SHARPS.indexOf(rootSelect.value);renderKeyWheel();keyWheelMenu.hidden=false;keyWheelTrigger.setAttribute("aria-expanded","true")}
function closeKeyWheel(){keyWheelMenu.hidden=true;keyWheelTrigger.setAttribute("aria-expanded","false")}
function commitKey(note){rootSelect.value=note;wheelCenterIndex=CHROMATIC_SHARPS.indexOf(note);keyWheelValue.textContent=displayNote(note);closeKeyWheel();rootSelect.dispatchEvent(new Event("change",{bubbles:true}));keyWheelTrigger.focus()}
function moveKeyWheel(direction){wheelCenterIndex=(wheelCenterIndex+direction+12)%12;renderKeyWheel()}
function updateAccidentalControls(){for(const option of rootSelect.options)option.textContent=displayNote(option.value);accidentalToggle.textContent=accidentalDisplay==="sharps"?"#":"b";accidentalToggle.setAttribute("aria-label",accidentalDisplay==="sharps"?"Showing sharps; switch to flats":"Showing flats; switch to sharps");keyWheelValue.textContent=displayNote(rootSelect.value);if(!keyWheelMenu.hidden)renderKeyWheel()}
function noteLabel(text,isInterval=false){const label=document.createElement("span"),noteText=document.createElement("span"),natural=document.createElement("span");label.className="note-label";noteText.className="note-text";natural.className="note-natural";let accidental="",main=text;if(isInterval&&/^[#b♯♭]/.test(text)){accidental=text[0];main=text.slice(1)}else if(/[#b♯♭]$/.test(text)){accidental=text.slice(-1);main=text.slice(0,-1)}if(isInterval&&accidental){const accidentalLabel=document.createElement("span");accidentalLabel.className="note-accidental";accidentalLabel.textContent=accidental;noteText.appendChild(accidentalLabel)}natural.textContent=main;noteText.appendChild(natural);if(!isInterval&&accidental){const accidentalLabel=document.createElement("span");accidentalLabel.className="note-accidental";accidentalLabel.textContent=accidental;noteText.appendChild(accidentalLabel)}label.appendChild(noteText);return label}
function updateFocusStatus(){focusStatus.textContent=focus.size===0?"No positions focused":`${focus.size} position${focus.size===1?"":"s"} focused`;clearFocus.disabled=focus.size===0}
function render(){
  const root=rootSelect.value,q=scaleSelect.value,v=scaleViewSelect.value,d=displaySelect.value,p=Number(positionSelect.value),formula=SCALE_FORMULAS[v][q],notes=buildScale(root,formula),scaleSet=new Set(notes),blueNote=v==="blues"?noteAtOffset(root,formula.blueOffset):null,use=d==="position",showIntervals=labelSelect.value==="intervals",cells=use?shapeCellSet(selectedShape(root,q,v,p)):null;
  positionSelect.disabled=!use;
  summary.innerHTML=`<strong>${displayNote(root)} ${formula.name}:</strong> ${notes.map(displayNote).join(" – ")} &nbsp;|&nbsp; <strong>${use?`Shape ${p+1}`:"Whole fretboard"}</strong>`;
  legend.innerHTML=showIntervals?`<span>Intervals:</span><span class="chip root-chip">R</span><span class="chip third-chip">3 / b3</span><span class="chip fifth-chip">5</span>${v==="blues"?`<span class="chip blue-chip">${INTERVAL_NAMES[formula.blueOffset]} blue note</span>`:""}`:(v==="blues"?`Blue note: <span class="chip blue-chip">${displayNote(blueNote)}</span>`:"");
  fretboardBody.innerHTML="";
  fretboard.forEach((stringData,i)=>{
    const stringMatches=allStringsActive||selectedStrings.has(stringData.string),row=document.createElement("tr"),label=document.createElement("td"),stringButton=document.createElement("button"),stringSelected=allStringsActive||selectedStrings.has(stringData.string);
    stringButton.type="button";stringButton.className="string-scope-button";stringButton.classList.toggle("selected",stringSelected);stringButton.setAttribute("aria-pressed",String(stringSelected));stringButton.textContent=stringData.label;stringButton.title=`Toggle ${stringData.label} string scope`;stringButton.addEventListener("click",()=>toggleStringScope(stringData.string));label.appendChild(stringButton);row.appendChild(label);
    stringData.frets.forEach(({note,fret})=>{
      const baseInView=use?cells.has(`${i}:${fret}`):scaleSet.has(note),inView=stringMatches&&baseInView,off=intervalOffset(root,note),interval=INTERVAL_NAMES[off],key=positionKey(stringData.string,fret),isFocused=focus.has(stringData.string,fret),isOverride=isFocused&&focusOverrides.has(key)&&stringMatches,show=inView||isOverride,isBlue=inView&&v==="blues"&&off===formula.blueOffset,isRoot=inView&&off===0,isThird=inView&&(off===3||off===4),isFifth=inView&&off===7,cell=document.createElement("td");
      cell.className=["fret-position",inView?"scale-note":"not-in-scale",!show?"hidden-note":"",fret===MAX_FRET?"suppressed-fret":"",!showIntervals&&inView&&note===root?"root-note":"",showIntervals&&isRoot?"role-root":"",showIntervals&&isThird?"role-third":"",showIntervals&&isFifth?"role-fifth":"",isBlue?"blue-note":"",isFocused&&show?"focused-position":""].filter(Boolean).join(" ");
      if(show)cell.appendChild(noteLabel(showIntervals?interval:displayNote(note),showIntervals));
      cell.dataset.string=String(stringData.string);cell.dataset.fret=String(fret);cell.title=`String ${stringData.string}, ${fret===0?"open":`fret ${fret}`}: ${displayNote(note)}`;
      cell.addEventListener("click",()=>{if(isFocused){focus.toggle(stringData.string,fret);focusOverrides.delete(key)}else{focus.toggle(stringData.string,fret);focusOverrides.add(key)}render()});row.appendChild(cell)
    });
    fretboardBody.appendChild(row)
  });
  const allStringsButton=document.querySelector("#all-strings");allStringsButton.classList.toggle("selected",allStringsActive);allStringsButton.setAttribute("aria-pressed",String(allStringsActive));positionFretboardCells(document.querySelector("#fretboard-table"),MAX_FRET);updateFocusStatus()
}
const clearFocus=document.querySelector("#clear-focus"),focusStatus=document.querySelector("#focus-status");
clearFocus.addEventListener("click",()=>{focus.clear();focusOverrides.clear();render()});
configureFretboardView({table:document.querySelector("#fretboard-table"),head:fretboardHead,maxFret:MAX_FRET,firstHeader:'<button type="button" id="all-strings" class="string-scope-button selected" aria-pressed="true" title="Show all strings">Show All</button>'});
document.querySelector("#all-strings").addEventListener("click",()=>{resetStringScope();render()});
accidentalToggle.addEventListener("click",()=>{accidentalDisplay=accidentalDisplay==="sharps"?"flats":"sharps";updateAccidentalControls();render()});
keyWheelTrigger.addEventListener("click",()=>{if(keyWheelMenu.hidden)openKeyWheel();else closeKeyWheel()});
keyWheelMenu.addEventListener("wheel",event=>{event.preventDefault();const now=performance.now();if(Math.abs(event.deltaY)<1||now-lastWheelStep<70)return;lastWheelStep=now;moveKeyWheel(event.deltaY>0?1:-1)},{passive:false});
keyWheelTrigger.addEventListener("keydown",event=>{if(event.key!=="ArrowDown"&&event.key!=="ArrowUp"&&event.key!=="Escape")return;event.preventDefault();if(event.key==="Escape"){closeKeyWheel();return}if(keyWheelMenu.hidden)openKeyWheel();moveKeyWheel(event.key==="ArrowDown"?1:-1);keyWheelMenu.querySelector(".center").focus()});
keyWheelMenu.addEventListener("keydown",event=>{if(event.key==="Escape"){event.preventDefault();closeKeyWheel();keyWheelTrigger.focus();return}if(event.key!=="ArrowDown"&&event.key!=="ArrowUp")return;event.preventDefault();moveKeyWheel(event.key==="ArrowDown"?1:-1);keyWheelMenu.querySelector(".center").focus()});
document.addEventListener("click",event=>{if(!keyWheel.contains(event.target))closeKeyWheel()});
[rootSelect,scaleSelect,scaleViewSelect,displaySelect,positionSelect,labelSelect].forEach(el=>el.addEventListener("change",render));
updateAccidentalControls();render();

</script></body></html>
